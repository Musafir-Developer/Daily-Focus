<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Focus | Simple To-Do List</title>
    <!-- Load Tailwind CSS for clean, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-indigo-100 selection:text-indigo-700">

    <!-- Main Container -->
    <div class="w-full max-w-xl mx-auto px-4 py-8 sm:py-12">

        <!-- Clean Header -->
        <header class="mb-8 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2">
            <div>
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shadow-indigo-200">
                        <!-- Checkmark Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Daily Focus</h1>
                </div>
                <p id="current-date" class="text-sm text-slate-500 mt-1.5 font-medium"></p>
            </div>

            <!-- Task Counter Pill -->
            <div class="inline-flex items-center self-start sm:self-auto bg-white border border-slate-200/80 rounded-full px-3.5 py-1.5 shadow-xs">
                <span id="task-counter" class="text-xs font-semibold text-slate-600">0 of 0 completed</span>
            </div>
        </header>

        <!-- Main Card -->
        <main class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">

            <!-- Add Task Form -->
            <form id="task-form" class="p-4 sm:p-5 border-b border-slate-100 bg-slate-50/50">
                <div class="flex gap-2.5">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="What do you want to focus on today?"
                        autocomplete="off"
                        class="flex-1 bg-white text-slate-800 placeholder-slate-400 text-sm sm:text-base rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                    >
                    <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium text-sm sm:text-base px-5 py-3 rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer shrink-0"
                        aria-label="Add task"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add</span>
                    </button>
                </div>
                <!-- Inline Validation Message (Replaces alert) -->
                <p id="error-msg" class="text-xs text-rose-500 mt-2 hidden font-medium">Please enter a task before adding.</p>
            </form>

            <!-- Filter Tabs & Clear Action -->
            <div class="px-4 sm:px-5 py-3 border-b border-slate-100 flex items-center justify-between text-xs font-medium text-slate-500">
                <div class="flex gap-1 bg-slate-100 p-1 rounded-lg" role="tablist">
                    <button type="button" data-filter="all" class="filter-btn px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-2xs transition-all cursor-pointer">All</button>
                    <button type="button" data-filter="active" class="filter-btn px-3 py-1.5 rounded-md hover:text-slate-800 transition-all cursor-pointer">Active</button>
                    <button type="button" data-filter="completed" class="filter-btn px-3 py-1.5 rounded-md hover:text-slate-800 transition-all cursor-pointer">Done</button>
                </div>

                <button
                    type="button"
                    id="clear-completed-btn"
                    class="text-slate-400 hover:text-rose-600 transition-colors cursor-pointer hidden"
                >
                    Clear done
                </button>
            </div>

            <!-- Task List Container -->
            <ul id="task-list" class="divide-y divide-slate-100 max-h-[60vh] overflow-y-auto">
                <!-- Tasks will be dynamically rendered here -->
            </ul>

            <!-- Empty State -->
            <div id="empty-state" class="py-12 px-4 text-center hidden">
                <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </div>
                <p id="empty-title" class="text-sm font-medium text-slate-700">No tasks yet</p>
                <p id="empty-subtitle" class="text-xs text-slate-400 mt-1">Add your first task above to get started.</p>
            </div>

        </main>
    </div>

    <!-- Clean Footer -->
    <footer class="py-6 text-center text-xs text-slate-400">
        <p>Saved locally in your browser &bull; Ready for GitHub Pages</p>
    </footer>

    <!-- Application Logic -->
    <script>
        /**
         * Daily Focus - Single-File To-Do List Application
         * Stores all tasks safely in browser localStorage.
         */
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const taskForm = document.getElementById('task-form');
            const taskInput = document.getElementById('task-input');
            const errorMsg = document.getElementById('error-msg');
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            const emptyTitle = document.getElementById('empty-title');
            const emptySubtitle = document.getElementById('empty-subtitle');
            const taskCounter = document.getElementById('task-counter');
            const clearCompletedBtn = document.getElementById('clear-completed-btn');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const currentDateEl = document.getElementById('current-date');

            // Storage Key
            const STORAGE_KEY = 'daily_focus_tasks_v1';

            // App State
            let tasks = loadTasks();
            let currentFilter = 'all';

            // Display formatted current date in header
            function setFormattedDate() {
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                currentDateEl.textContent = new Date().toLocaleDateString('en-US', options);
            }

            // Load tasks safely from localStorage
            function loadTasks() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch (error) {
                    console.error('Failed to load tasks from localStorage:', error);
                    return [];
                }
            }

            // Save tasks safely to localStorage
            function saveTasks() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                } catch (error) {
                    console.error('Failed to save tasks to localStorage:', error);
                }
            }

            // Add a new task
            function addTask(text) {
                const newTask = {
                    id: Date.now().toString(),
                    text: text.trim(),
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                tasks.unshift(newTask);
                saveTasks();
                render();
            }

            // Toggle task completion status
            function toggleTask(id) {
                tasks = tasks.map(task =>
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                saveTasks();
                render();
            }

            // Delete a task
            function deleteTask(id) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                render();
            }

            // Clear all completed tasks
            function clearCompleted() {
                tasks = tasks.filter(task => !task.completed);
                saveTasks();
                render();
            }

            // Escape HTML to prevent XSS
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // Render UI based on current state
            function render() {
                // Update Counter
                const completedCount = tasks.filter(t => t.completed).length;
                taskCounter.textContent = `${completedCount} of ${tasks.length} completed`;

                // Show/Hide "Clear done" button
                if (completedCount > 0) {
                    clearCompletedBtn.classList.remove('hidden');
                } else {
                    clearCompletedBtn.classList.add('hidden');
                }

                // Filter tasks
                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });

                // Clear current list
                taskList.innerHTML = '';

                // Handle Empty State
                if (filteredTasks.length === 0) {
                    emptyState.classList.remove('hidden');
                    if (tasks.length === 0) {
                        emptyTitle.textContent = 'No tasks yet';
                        emptySubtitle.textContent = 'Add your first task above to get started.';
                    } else if (currentFilter === 'active') {
                        emptyTitle.textContent = 'All caught up!';
                        emptySubtitle.textContent = 'You have no active tasks remaining.';
                    } else {
                        emptyTitle.textContent = 'No completed tasks';
                        emptySubtitle.textContent = 'Complete a task to see it here.';
                    }
                } else {
                    emptyState.classList.add('hidden');

                    // Build list items
                    filteredTasks.forEach(task => {
                        const li = document.createElement('li');
                        li.className = 'group flex items-center justify-between gap-3 px-4 sm:px-5 py-3.5 hover:bg-slate-50/80 transition-colors';

                        li.innerHTML = `
                            <label class="flex items-center gap-3.5 flex-1 cursor-pointer select-none min-w-0">
                                <input
                                    type="checkbox"
                                    ${task.completed ? 'checked' : ''}
                                    data-id="${task.id}"
                                    class="task-checkbox peer sr-only"
                                >
                                <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 transition-all ${
                                    task.completed
                                    ? 'bg-indigo-600 border-indigo-600 text-white'
                                    : 'border-slate-300 bg-white group-hover:border-indigo-400'
                                }">
                                    ${task.completed ? `
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                    ` : ''}
                                </div>
                                <span class="text-sm sm:text-base truncate transition-all ${
                                    task.completed
                                    ? 'line-through text-slate-400'
                                    : 'text-slate-700 font-medium'
                                }">
                                    ${escapeHTML(task.text)}
                                </span>
                            </label>
                            <button
                                type="button"
                                data-id="${task.id}"
                                class="delete-btn p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 cursor-pointer shrink-0"
                                aria-label="Delete task"
                                title="Delete task"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        `;

                        taskList.appendChild(li);
                    });
                }
            }

            // Form Submit Listener
            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const value = taskInput.value.trim();

                if (!value) {
                    errorMsg.classList.remove('hidden');
                    taskInput.focus();
                    return;
                }

                errorMsg.classList.add('hidden');
                addTask(value);
                taskInput.value = '';
                taskInput.focus();
            });

            // Hide error message on typing
            taskInput.addEventListener('input', () => {
                if (!errorMsg.classList.contains('hidden')) {
                    errorMsg.classList.add('hidden');
                }
            });

            // Event Delegation for Checkboxes & Delete Buttons
            taskList.addEventListener('change', (e) => {
                if (e.target.classList.contains('task-checkbox')) {
                    toggleTask(e.target.dataset.id);
                }
            });

            taskList.addEventListener('click', (e) => {
                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    deleteTask(deleteBtn.dataset.id);
                }
            });

            // Filter Tabs Listener
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;

                    // Update active tab styling
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-white', 'text-slate-800', 'shadow-2xs');
                        b.classList.add('hover:text-slate-800');
                    });
                    btn.classList.add('bg-white', 'text-slate-800', 'shadow-2xs');
                    btn.classList.remove('hover:text-slate-800');

                    render();
                });
            });

            // Clear Completed Listener
            clearCompletedBtn.addEventListener('click', clearCompleted);

            // Initialize App
            setFormattedDate();
            render();
        });
    </script>
</body>
</html>
